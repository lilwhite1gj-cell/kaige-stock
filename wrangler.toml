name = "kaige-stock"
main = "src/worker.js"
compatibility_date = "2024-11-15"
compatibility_flags = ["nodejs_compat"]

# 静态资源（前端）由 Worker 直接托管
[assets]
directory = "./public"
binding = "ASSETS"

# Cloudflare KV：云端存储新闻/分析/状态（替代本地文件）
kv_namespaces = [
  { binding = "NEWS_KV", id = "9fa34598836a445c8aa4a25ff331faa6" }
]

# 定时任务：每日 UTC 01:00（北京时间 09:00）自动抓取新闻 + 生成 AI 分析
# 修改时间请使用标准 cron 表达式
[triggers]
crons = ["0 1 * * *"]
